<section id="five">
  <div class="label"><span class="tag">Summary</span><h2>The whole session in 5 lines</h2></div>
  <ol>
    <li>External Secrets is easier as <strong>two pictures</strong>: a simple one to remember and explain in an interview, and a detailed one you look up.</li>
    <li>The operator is a <strong>copy program</strong>: AWS Secrets Manager → a Kubernetes Secret. It needs <strong>AWS access, Kubernetes access, and instructions</strong>.</li>
    <li>A Secret always belongs to <strong>one namespace</strong>. There's no cluster-wide Secret.</li>
    <li>Resource management = <strong>reservations</strong> (requests), <strong>caps</strong> (limits, LimitRange, ResourceQuota) and <strong>scaling</strong> (HPA for pods, Karpenter for nodes).</li>
    <li>You don't need to memorise commands, but you <strong>do</strong> need to explain the tools in your own words.</li>
  </ol>
</section>

<section id="t3">
  <div class="label"><span class="tag">3</span><h2>External Secrets: the simple picture</h2></div>
  <div class="q"><p class="ask">I got External Secrets for a moment, then forgot it. How do I keep the whole picture?</p>
    <details><summary>Show answer</summary><div>
      <p><strong>Keep two pictures, not one.</strong> A short one you remember and could describe in <strong>3–4 minutes</strong> in an interview, and a detailed one with every object that you write down and look up. Marcel said he can't recite the detailed one from memory either.</p>
    </div></details></div>
  <div class="q"><p class="ask">What does External Secrets actually do?</p>
    <details><summary>Show answer</summary><div>
      <p><strong>It copies values from AWS Secrets Manager into a normal Kubernetes Secret, and keeps them in sync.</strong> Your pod keeps reading a Kubernetes Secret as in Session 09.</p>
      <div class="flow">AWS Secrets Manager → External Secrets Operator → Kubernetes Secret → pod</div>
      <ul><li>You could copy values by hand and <code>kubectl apply</code> a Secret. The operator does it for you.</li></ul>
    </div></details></div>
  <div class="q"><p class="ask">What's an "operator"?</p>
    <details><summary>Show answer</summary><div>
      <p><strong>A program that runs in the cluster all the time and does one job.</strong></p>
      <ul>
        <li>The External Secrets Operator's job is copying. <strong>One installation per cluster.</strong></li>
        <li>Many sources (AWS Secrets Manager, HashiCorp Vault, Google Secret Manager, Azure Key Vault), <strong>one destination</strong>: a Kubernetes Secret.</li>
        <li>Other operators do other jobs, e.g. keeping TLS certificates up to date. There are hundreds. Using one is easy (install, follow the docs); building one takes a whole team.</li>
      </ul>
    </div></details></div>
  <div class="q"><p class="ask">What does the operator need to copy one secret?</p>
    <details><summary>Show answer</summary><div>
      <p><strong>Three things:</strong></p>
      <div class="table"><table>
        <thead><tr><th>Need</th><th>Given by</th></tr></thead>
        <tbody>
          <tr><td><strong>Access to AWS</strong></td><td>An <strong>IAM role</strong> that may read the secret</td></tr>
          <tr><td><strong>Access to Kubernetes</strong></td><td><strong>RBAC</strong> rules that let it create and update Secrets</td></tr>
          <tr><td><strong>Instructions</strong></td><td>An <strong>ExternalSecret</strong>: which AWS secret to read, which Secret to write, in which namespace, which keys</td></tr>
        </tbody>
      </table></div>
      <ul><li>The Secret is written in the namespace where you apply the ExternalSecret.</li></ul>
      <blockquote>This is the picture to explain in an interview.</blockquote>
    </div></details></div>
  <div class="q"><p class="ask">In the lab I saw secrets per namespace. Is there also a cluster-wide Secret?</p>
    <details><summary>Show answer</summary><div>
      <p><strong>No. A Secret always belongs to one namespace.</strong> The same value in two namespaces is two Secrets.</p>
      <ul><li>The <strong>operator</strong> is one per cluster. <strong>Secrets</strong> can be anywhere from zero to thousands, spread across namespaces.</li></ul>
    </div></details></div>
</section>

<section id="t4">
  <div class="label"><span class="tag">4</span><h2>External Secrets: the detailed picture</h2></div>
  <div class="q"><p class="ask">Which objects make it work on the class cluster?</p>
    <details><summary>Show answer</summary><div>
      <div class="table"><table>
        <thead><tr><th>Object</th><th>Where</th><th>Job</th></tr></thead>
        <tbody>
          <tr><td>IAM role <code>containers-26a-secrets-&lt;namespace&gt;</code></td><td>AWS</td><td>Policy allows <code>GetSecretValue</code> on <code>/26a/&lt;namespace&gt;/</code> only</td></tr>
          <tr><td>IAM OIDC provider + AWS STS</td><td>AWS</td><td>How a pod signs in as an IAM role</td></tr>
          <tr><td>ServiceAccount <code>secrets-reader</code></td><td>Your namespace</td><td>Its annotation names the IAM role</td></tr>
          <tr><td>SecretStore <code>aws-secrets-manager</code></td><td>Your namespace</td><td>The AWS region and the ServiceAccount to sign in as</td></tr>
          <tr><td>Operator's ServiceAccount, ClusterRole, ClusterRoleBinding</td><td><code>external-secrets</code> namespace</td><td>Let it create and update Secrets</td></tr>
          <tr><td><strong>ExternalSecret</strong></td><td>Your namespace</td><td><strong>The one file you write.</strong> Everything above was made before class</td></tr>
        </tbody>
      </table></div>
      <ul>
        <li>Marcel corrected the first diagram: it's the <strong><code>secrets-reader</code></strong> ServiceAccount that's linked to the IAM role, not the operator's own ServiceAccount.</li>
        <li>If the source isn't AWS (Vault, Azure…), the store layer changes; the rest stays the same.</li>
        <li>The two diagrams are in the class Slack channel.</li>
      </ul>
    </div></details></div>
  <div class="q"><p class="ask">How does a pod "become" an IAM role?</p>
    <details><summary>Show answer</summary><div>
      <p><strong>Through OIDC and STS.</strong> The operator sends the ServiceAccount's token to <strong>AWS STS</strong> and gets <strong>temporary credentials</strong> for the role. A pod isn't an EC2 instance, so it can't use an instance profile (Scale Session 04); OIDC is how pods log in to AWS.</p>
    </div></details></div>
  <div class="q"><p class="ask">Is that IAM policy the same kind of JSON we wrote for ECR?</p>
    <details><summary>Show answer</summary><div>
      <p><strong>Yes, same shape, different permission.</strong> The ECR one allowed pulling images; this one allows reading secrets.</p>
      <ul><li>💡 Once you get the AWS + Kubernetes sign-in pattern, it's the same everywhere: another operator or your own pod, the structure is the same. Only <strong>what</strong> you grant changes (secrets, a bucket, …).</li></ul>
    </div></details></div>
  <div class="q"><p class="ask">SecretStore or ClusterSecretStore?</p>
    <details><summary>Show answer</summary><div>
      <div class="table"><table>
        <thead><tr><th></th><th>SecretStore</th><th>ClusterSecretStore</th></tr></thead>
        <tbody>
          <tr><td>Belongs to</td><td>One namespace</td><td>The whole cluster</td></tr>
          <tr><td>Used by</td><td>ExternalSecrets in <strong>that</strong> namespace</td><td>ExternalSecrets in <strong>any</strong> namespace, or only the ones it lists</td></tr>
        </tbody>
      </table></div>
      <ul><li>Whoever sets up the cluster chooses. On the class cluster each namespace has its own SecretStore and IAM role, so you can read only your own secrets.</li></ul>
    </div></details></div>
  <div class="q"><p class="ask">How is Lab 114 different from class?</p>
    <details><summary>Show answer</summary><div>
      <p><strong>It has no AWS.</strong></p>
      <ul>
        <li>The namespace <code>vault</code> plays AWS Secrets Manager; each Secret in it is one secret in the store.</li>
        <li>A <strong>Role and RoleBinding</strong> in <code>vault</code> replace the IAM policy.</li>
        <li>No OIDC or STS: the store signs in to Kubernetes with a ServiceAccount token.</li>
        <li>ExternalSecret, SecretStore and the written Secret work as in class.</li>
        <li><strong>Task 5</strong> asks you to write a <strong>ClusterSecretStore</strong>.</li>
      </ul>
    </div></details></div>
</section>

<section id="t5">
  <div class="label"><span class="tag">5</span><h2>Resource management recap (Session 12)</h2></div>
  <div class="q"><p class="ask">What's the big picture of requests, limits and quotas?</p>
    <details><summary>Show answer</summary><div>
      <p><strong>Every CPU and gigabyte costs money, and a pod without enough slows down or fails.</strong> Three groups:</p>
      <div class="table"><table>
        <thead><tr><th>Group</th><th>Goal</th><th>Kubernetes feature</th></tr></thead>
        <tbody>
          <tr><td><strong>Reservations</strong></td><td>Enough for every pod</td><td>Resource <strong>requests</strong> (+ LimitRange defaults)</td></tr>
          <tr><td><strong>Caps</strong></td><td>No pod takes from others; no surprise bill</td><td>Resource <strong>limits</strong>, <strong>LimitRange</strong> max, <strong>ResourceQuota</strong></td></tr>
          <tr><td><strong>Scaling</strong></td><td>Meet demand</td><td><strong>HPA</strong> (pods), <strong>Karpenter</strong> (nodes)</td></tr>
        </tbody>
      </table></div>
    </div></details></div>
  <div class="q"><p class="ask">What happens when a container goes over its limit?</p>
    <details><summary>Show answer</summary><div>
      <div class="table"><table>
        <thead><tr><th>Resource</th><th>Over the limit</th></tr></thead>
        <tbody>
          <tr><td><strong>CPU</strong></td><td><strong>Throttled.</strong> The extra work waits; the app answers slower</td></tr>
          <tr><td><strong>Memory</strong></td><td><strong>OOMKilled</strong>, restarted in the same pod. RESTARTS goes up</td></tr>
        </tbody>
      </table></div>
    </div></details></div>
  <div class="q"><p class="ask">Why do we need caps if requests already reserve resources?</p>
    <details><summary>Show answer</summary><div>
      <p><strong>So a few pods can't starve the rest or run up the bill.</strong> Example: 100 pods on 20 nodes; if 10 use more than their share, the other 90 slow down.</p>
      <ul><li>Extreme usage can come from <strong>real traffic</strong>, a <strong>bug</strong> (an endless loop asking for more), or an <strong>attack</strong>.</li></ul>
    </div></details></div>
  <div class="q"><p class="ask">Is LimitRange per pod and ResourceQuota per namespace?</p>
    <details><summary>Show answer</summary><div>
      <p><strong>Close.</strong> Both are namespace policies, but they check different things:</p>
      <ul>
        <li><strong>LimitRange</strong> checks <strong>each container</strong>: fills in default requests/limits when none are written, and rejects a container above its maximum. So it's both reservation and cap.</li>
        <li><strong>ResourceQuota</strong> caps the <strong>namespace total</strong>: requests, limits and number of pods.</li>
        <li>Requests and limits are set <strong>per container</strong>. Most pods run one container, so in practice that's per pod.</li>
      </ul>
    </div></details></div>
  <div class="q"><p class="ask">Does ResourceQuota measure what pods actually use?</p>
    <details><summary>Show answer</summary><div>
      <p><strong>No. It adds up what pods declare in their YAML.</strong></p>
      <div class="table"><table>
        <thead><tr><th>Pod</th><th>Request</th><th>Limit</th></tr></thead>
        <tbody>
          <tr><td>A</td><td>1Gi</td><td>4Gi</td></tr>
          <tr><td>B</td><td>2Gi</td><td>4Gi</td></tr>
          <tr><td>C</td><td>2Gi</td><td>2Gi</td></tr>
          <tr><td><strong>Namespace total</strong></td><td><strong>5Gi</strong></td><td><strong>10Gi</strong></td></tr>
        </tbody>
      </table></div>
      <ul><li>A pod that would push the total over the quota is <strong>not created</strong>. Actual usage doesn't matter.</li></ul>
    </div></details></div>
  <div class="q"><p class="ask">Is a request a guarantee?</p>
    <details><summary>Show answer</summary><div>
      <p><strong>Only if it fits.</strong> The scheduler places a pod only on a node where its requests still fit. If no node has room, the pod stays <strong>Pending</strong>, waiting for capacity.</p>
    </div></details></div>
</section>

<section id="t6">
  <div class="label"><span class="tag">6</span><h2>Scaling: HPA &amp; Karpenter</h2></div>
  <div class="q"><p class="ask">What's the Kubernetes version of the AWS Auto Scaling group?</p>
    <details><summary>Show answer</summary><div>
      <p><strong>The Horizontal Pod Autoscaler (HPA).</strong> It adds pods when demand rises and removes them when it falls, toward a target you set, e.g. <strong>60% CPU</strong>.</p>
    </div></details></div>
  <div class="q"><p class="ask">The HPA added a pod but it's Pending. What now?</p>
    <details><summary>Show answer</summary><div>
      <p><strong>You need more nodes, and that's Karpenter's job.</strong> Karpenter adds EC2 nodes when pods are Pending because no node has room, and removes nodes that are no longer needed.</p>
      <div class="flow">traffic ↑ → CPU &gt; 60% → HPA adds pods → one doesn't fit → Pending
→ Karpenter launches a node → pod scheduled</div>
      <blockquote>The HPA scales pods. Karpenter scales nodes.</blockquote>
    </div></details></div>
</section>

<section id="remember">
  <blockquote>🔑 Remember: two pictures for External Secrets · operator needs AWS access + Kubernetes access + instructions · a Secret lives in one namespace · requests reserve, limits/quotas cap, HPA + Karpenter scale · quota counts what's declared, not what's used</blockquote>
</section>
