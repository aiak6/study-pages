  <h1>Session 13: Storage &amp; Jobs</h1>
  <div class="meta"><span>Mon, Oct 26, 2026</span><span>Eldiiar, after-class with Bakhtiyar</span><span>Ephemeral vs persistent · PVC, StorageClass &amp; PV · StatefulSets · Jobs &amp; CronJobs</span></div>
  <p class="lede"><em>Unit 6, the last class of Containers and Eldiiar's last class with us. A pod's own files die with the pod. That's fine for the web app, whose data lives in the database, and fatal for the database itself. Tonight Postgres got its own <strong>EBS disk</strong> through a <strong>PersistentVolumeClaim</strong>, so a replacement pod finds the same <code>trades</code> table. Then the <strong>StatefulSet</strong> (stable names and one disk per replica), the reality check that most teams keep production databases on RDS anyway, and finally <strong>Jobs</strong> (run a task until it succeeds, like creating tables before the app starts) and <strong>CronJobs</strong> (a Job on a schedule).</em></p>

<section id="ref">
  <div class="label"><span class="tag">Glance</span><h2>Quick reference</h2></div>
  <div class="table"><table>
    <thead><tr><th>Topic</th><th>Key point</th></tr></thead>
    <tbody>
      <tr><td><strong>Ephemeral</strong></td><td>Files written without a volume (<code>/app</code>, <code>/tmp</code>) sit on the node's disk and are <strong>gone when the pod is replaced</strong></td></tr>
      <tr><td><strong>Stateless vs stateful</strong></td><td>Web app = stateless (data lives in the DB). Postgres = <strong>stateful</strong>, needs persistent storage</td></tr>
      <tr><td><strong>PVC</strong></td><td>The <strong>request</strong>: size, access mode, StorageClass. Lives in <strong>your namespace</strong></td></tr>
      <tr><td><strong>StorageClass</strong></td><td>The <strong>template</strong> + provisioner that creates the disk (<code>unit6-ebs</code>: EBS gp3, encrypted, <strong>Delete</strong>). Made <strong>once</strong> per cluster</td></tr>
      <tr><td><strong>PV</strong></td><td>Kubernetes's <strong>record</strong> of the disk. Cluster-wide. A hand-written PV <strong>creates no disk</strong></td></tr>
      <tr><td><strong>Binding</strong></td><td><strong>One claim ↔ one PV</strong>, matched on size, access mode and StorageClass</td></tr>
      <tr><td><strong>Pending claim</strong></td><td>Normal with <code>WaitForFirstConsumer</code> until a pod uses it (same AZ as the pod). Pending <strong>after</strong> the pod exists → <code>describe pvc</code></td></tr>
      <tr><td><strong>ReadWriteOnce</strong></td><td>One <strong>node</strong> reads/writes. The EBS default. Many nodes writing → <strong>EFS</strong> (ReadWriteMany)</td></tr>
      <tr><td><strong>Reclaim policy</strong></td><td><code>Delete</code> = disk deleted with the claim (dev/test). <code>Retain</code> = disk stays, <strong>charges continue</strong> (prod). <strong>Not a backup</strong></td></tr>
      <tr><td><strong>StatefulSet</strong></td><td>Stable names <code>postgres-0/1</code>, <strong>one claim per pod</strong> via <code>volumeClaimTemplates</code>, scales one at a time</td></tr>
      <tr><td><strong>Job</strong></td><td>Runs a task <strong>until exit 0</strong>. <code>backoffLimit: 2</code>, <code>restartPolicy: Never</code>, <code>ttlSecondsAfterFinished: 300</code></td></tr>
      <tr><td><strong>CronJob</strong></td><td>Creates a <strong>new Job on a schedule</strong>: <code>"0 2 * * *"</code> = daily 02:00</td></tr>
    </tbody>
  </table></div>
</section>

<section id="ephemeral">
  <div class="label"><span class="tag">01</span><h2>Ephemeral storage: why Postgres lost its table</h2></div>
  <ul>
    <li><strong>Ephemeral</strong> = short-lived. Containers are meant to die and be replaced without fuss.</li>
    <li>Every pod runs on a node (an EC2 instance) with a <strong>root EBS volume</strong>. Files a container writes without a volume, under <code>/app</code> or <code>/tmp</code>, land there.</li>
    <li>When the Deployment replaces the pod, the new container starts <strong>fresh from the image</strong>. New pod ID, none of the old files.</li>
    <li><strong>Live demo:</strong> Eldiiar created a <code>trades</code> table in a plain Postgres Deployment, deleted the pod, and <code>\dt</code> in the new pod showed nothing.</li>
  </ul>
  <div class="codebox"><pre>kubectl -n "$NAMESPACE" apply -f postgres-ephemeral.yaml
kubectl -n "$NAMESPACE" exec -i deployment/unit6-postgres -- sh -ec \
  'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -v ON_ERROR_STOP=1' &lt; schema.sql
kubectl -n "$NAMESPACE" delete pod -l app=unit6-postgres      <span class="c"># "the pod crashed"</span>
kubectl -n "$NAMESPACE" exec deployment/unit6-postgres -- sh -ec \
  'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -c "SELECT side, price FROM trades;"'
<span class="c"># → relation "trades" does not exist</span></pre></div>
  <ul>
    <li><strong>Stateless</strong> apps (the investment web app) can lose local files, because the important data is in the database. <strong>Stateful</strong> apps (Postgres, MySQL, MongoDB, WordPress) cannot.</li>
    <li>Same idea as Docker Compose volumes in the family-app lab: Docker has its own way to keep data, and Kubernetes has its own.</li>
    <li>💡 Why companies care: banks and healthcare must keep records for <strong>5–10 years</strong>, even after the app is retired. Storage with its own lifecycle makes that possible.</li>
  </ul>
  <blockquote>Pods come and go. Your data should not.</blockquote>
</section>

<section id="objects">
  <div class="label"><span class="tag">02</span><h2>The three objects: PVC, StorageClass &amp; PV</h2></div>
  <div class="table"><table>
    <thead><tr><th>Object</th><th>What it is</th><th>Who makes it</th><th>Scope</th></tr></thead>
    <tbody>
      <tr><td><strong>PVC</strong> (PersistentVolumeClaim)</td><td>The <strong>request</strong>: size, access mode, StorageClass</td><td>Developer</td><td>Namespace</td></tr>
      <tr><td><strong>StorageClass</strong></td><td>The <strong>template</strong>: provisioner, disk type, encryption, reclaim policy, binding mode</td><td>DevOps, once</td><td>Cluster</td></tr>
      <tr><td><strong>PV</strong> (PersistentVolume)</td><td>Kubernetes's <strong>record</strong> of the real disk</td><td>Created automatically</td><td>Cluster</td></tr>
      <tr><td><strong>EBS volume</strong></td><td>The disk that holds the files</td><td>The provisioner, in AWS</td><td>One AZ</td></tr>
    </tbody>
  </table></div>
  <div class="flow">developer applies PVC → StorageClass → provisioner (ebs.csi.aws.com) creates an EBS disk
→ Kubernetes records it as a PV → PVC bound to PV → pod mounts the claim</div>
  <ul>
    <li><strong>Binding</strong> is strictly one-to-one: one claim, one PV, reserved for that claim alone. Kubernetes matches size, access mode and StorageClass; if nothing matches, you get no storage.</li>
    <li>The <strong>StorageClass is like the launch template</strong> for an Auto Scaling group (Scale Session 09): set once, reused for every new disk.</li>
    <li><strong>Manual provisioning:</strong> an admin creates disks and PVs by hand, then developers claim them. Painful and error-prone: the 10 GiB runs out and someone files a ticket. Eldiiar tried a hand-written PV live and found it pointed at a local host path. 🔑 <strong>A hand-written PV only records storage that already exists. It creates no disk.</strong></li>
    <li><strong>Dynamic provisioning:</strong> the admin deploys a StorageClass once; developers just write a claim. Self-service, no Jira ticket, and the disk count matches what's actually claimed.</li>
    <li><code>k get sc</code> showed <code>unit6-ebs</code> (made by the cluster admin) plus a default <code>gp2</code> class, probably from EKS Auto Mode.</li>
    <li>💡 Cost: EBS is cheap, but audit monthly or quarterly for abandoned volumes and teach teams to clean up.</li>
  </ul>
  <blockquote>The claim is the request. The PV is the record. EBS holds the files.</blockquote>
</section>

<section id="pending">
  <div class="label"><span class="tag">03</span><h2>StorageClass settings &amp; why a claim waits in Pending</h2></div>
  <div class="table"><table>
    <thead><tr><th>Setting</th><th>Class value</th><th>Meaning</th></tr></thead>
    <tbody>
      <tr><td><code>provisioner</code></td><td><code>ebs.csi.aws.com</code></td><td>Which driver creates the disk. Like a Terraform provider: different on GCP or Azure</td></tr>
      <tr><td><code>type</code></td><td><code>gp3</code></td><td>Current general-purpose EBS type</td></tr>
      <tr><td><code>encrypted</code></td><td><code>true</code></td><td>Encrypt the disk</td></tr>
      <tr><td><code>reclaimPolicy</code></td><td><code>Delete</code></td><td>What happens to the disk when the claim is deleted</td></tr>
      <tr><td><code>volumeBindingMode</code></td><td><code>WaitForFirstConsumer</code></td><td>Create the disk only when a pod uses the claim</td></tr>
      <tr><td><code>allowVolumeExpansion</code></td><td><code>false</code> here</td><td>Whether a claim may grow later</td></tr>
    </tbody>
  </table></div>
  <div class="codebox"><pre>kubectl -n "$NAMESPACE" scale deployment/unit6-postgres --replicas=0
kubectl -n "$NAMESPACE" apply -f pvc.yaml
kubectl -n "$NAMESPACE" get pvc postgres-data-unit6     <span class="c"># STATUS Pending</span></pre></div>
  <ul>
    <li><strong>Why Pending is normal:</strong> with <code>WaitForFirstConsumer</code>, the disk is created when a pod uses the claim, so the disk and pod end up in the <strong>same availability zone</strong>. An EBS disk lives in one AZ (Class 22).</li>
    <li><code>Immediate</code> binds right away, before any pod.</li>
    <li>🔑 A claim still <strong>Pending after its pod exists</strong> has a problem. Read the Events: <code>kubectl describe pvc postgres-data-unit6</code> (e.g. the StorageClass name doesn't exist).</li>
  </ul>
</section>

<section id="mount">
  <div class="label"><span class="tag">04</span><h2>Mounting the claim &amp; the table that survived</h2></div>
  <div class="codebox"><pre><span class="c"># postgres-persistent.yaml</span>
containers:
- name: postgres
  volumeMounts:
  - name: database-files               <span class="c"># same name as below</span>
    mountPath: /var/lib/postgresql/data
volumes:
- name: database-files
  persistentVolumeClaim:
    claimName: postgres-data-unit6     <span class="c"># selects the claim</span></pre></div>
  <ul>
    <li><code>volumes:</code> (pod level) names a volume and points it at a claim. <code>volumeMounts:</code> (container level) uses the <strong>same name</strong> and picks the folder.</li>
    <li>Postgres writes its files under <code>/var/lib/postgresql/data</code>, which is now the EBS disk.</li>
    <li>The claim and the Deployment can live in <strong>one YAML file</strong> separated by <code>---</code>.</li>
  </ul>
  <div class="codebox"><pre>kubectl -n "$NAMESPACE" apply -f postgres-persistent.yaml
kubectl -n "$NAMESPACE" get pvc,pv              <span class="c"># claim Bound to a PV nobody wrote</span>
<span class="c"># create the table, INSERT ('buy', 150.00), then:</span>
kubectl -n "$NAMESPACE" delete pod -l app=unit6-postgres
kubectl -n "$NAMESPACE" exec deployment/unit6-postgres -- sh -ec \
  'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -c "SELECT side, price FROM trades;"'
<span class="c"># → buy | 150.00</span></pre></div>
  <ul>
    <li>The pod took longer to start the first time: AWS was creating the disk. The new gp3 1 GiB volume showed up in the EC2 console under <strong>Volumes</strong>.</li>
    <li>After the pod was deleted, the replacement got a <strong>new name</strong> but mounted the <strong>same claim</strong>, and the trade was still there.</li>
    <li>Adding storage doesn't bring back data lost earlier. It protects data from now on.</li>
  </ul>
</section>

<section id="modes">
  <div class="label"><span class="tag">05</span><h2>Access modes &amp; reclaim policy</h2></div>
  <div class="table"><table>
    <thead><tr><th>Access mode</th><th>Means</th></tr></thead>
    <tbody>
      <tr><td><strong>ReadWriteOnce</strong> (RWO)</td><td>One <strong>node</strong> reads and writes; pods on that node can share it. <strong>The usual mode for EBS</strong></td></tr>
      <tr><td><strong>ReadOnlyMany</strong></td><td>Many nodes read; none write</td></tr>
      <tr><td><strong>ReadWriteMany</strong></td><td>Many nodes read and write. Needs shared file storage like <strong>Amazon EFS</strong>; an EBS disk attaches to one node at a time</td></tr>
      <tr><td><strong>ReadWriteOncePod</strong></td><td>One <strong>pod</strong> in the whole cluster reads and writes</td></tr>
    </tbody>
  </table></div>
  <ul><li>Two nodes writing to one EBS disk would corrupt it. That's why EBS is RWO and EFS is the answer for many writers.</li></ul>
  <div class="table"><table>
    <thead><tr><th>Action</th><th>What happens</th></tr></thead>
    <tbody>
      <tr><td>Replace the pod</td><td>Claim and disk remain</td></tr>
      <tr><td>Delete the claim, policy <code>Delete</code></td><td>Disk and data deleted</td></tr>
      <tr><td>Delete the claim, policy <code>Retain</code></td><td>Disk and data remain until an admin deletes them; <strong>storage charges continue</strong></td></tr>
      <tr><td>Delete the namespace</td><td>Its claims are deleted; their reclaim policies apply</td></tr>
    </tbody>
  </table></div>
  <ul>
    <li><strong>Production → Retain. Dev/test → Delete</strong>, so leftover disks from mock-data testing don't pile up.</li>
    <li>Deleting stateful resources can sit in <code>Terminating</code> for a few minutes: the claim waits for its pod to stop using it.</li>
  </ul>
  <blockquote>Persistent storage is not a backup.</blockquote>
</section>

<section id="sts">
  <div class="label"><span class="tag">06</span><h2>StatefulSets vs Deployments</h2></div>
  <div class="table"><table>
    <thead><tr><th></th><th>Deployment</th><th>StatefulSet</th></tr></thead>
    <tbody>
      <tr><td>Pod names</td><td>Random hash, new on every replacement</td><td>Stable, ordered: <code>postgres-0</code>, <code>postgres-1</code></td></tr>
      <tr><td>Storage</td><td>Replicas point at the same claim</td><td><strong>One claim per pod</strong>, from <code>volumeClaimTemplates</code></td></tr>
      <tr><td>Scaling</td><td>All at once, any order</td><td>One at a time, in order, each healthy before the next</td></tr>
      <tr><td>Replacement</td><td>New name</td><td><strong>Same name, same claim</strong></td></tr>
      <tr><td>Good for</td><td>Stateless apps; a 1-replica DB works</td><td>Databases and other stateful apps</td></tr>
    </tbody>
  </table></div>
  <ul>
    <li>A Deployment with <strong>one replica and one claim</strong> works, as in the demo. With more replicas it doesn't: a ReadWriteOnce EBS claim can't be attached by a replica on another node, and each database replica needs its own disk anyway.</li>
    <li>In a StatefulSet you don't write a separate PVC: <code>volumeClaimTemplates</code> describes the claim, and it creates <code>data-postgres-0</code>, <code>data-postgres-1</code> and so on. You still need the StorageClass.</li>
    <li>The app still reaches the database through a <strong>Service name</strong>, which never changes when pods are replaced. Stable pod names matter when a client must reach <strong>one specific replica</strong>.</li>
    <li>(Live, Eldiiar framed it as Deployment replicas sharing one PV and corrupting it, and Deployment DNS changing on restart. The site notes put it as above.)</li>
    <li>A StatefulSet does <strong>not</strong> configure replication or backups.</li>
  </ul>
</section>

<section id="rds">
  <div class="label"><span class="tag">07</span><h2>A disk doesn't run the database: why teams use RDS</h2></div>
  <ul>
    <li>Backups and recovery, replication and failover, upgrades, availability zones: all still your job with a Postgres pod. An EBS disk sits in one AZ and is not a second copy.</li>
    <li>In a <strong>shared cluster</strong>, someone else's bad requests and limits can starve your database, and you can't control 50–100 people (Sessions 11–12).</li>
    <li>So most teams run production databases on <strong>Amazon RDS</strong>, outside the cluster. Same reasoning as moving Postgres off EC2 in Scale Sessions 05–06.</li>
    <li>StatefulSets still matter: small or cost-constrained setups, a cluster dedicated to databases, and <strong>interviews and certifications</strong>.</li>
  </ul>
</section>

<section id="jobs">
  <div class="label"><span class="tag">08</span><h2>Jobs: work that finishes</h2></div>
  <div class="flow">Job → creates a pod → task runs → exit 0 = Complete
                                → non-zero = failed attempt → new pod (up to backoffLimit)</div>
  <ul>
    <li>A <strong>Deployment</strong> keeps something running forever. A <strong>Job</strong> runs a task <strong>until it succeeds</strong>, then stops. Like a cron script: wake, run, exit.</li>
    <li>Kubernetes decides success by the <strong>exit code</strong>: <code>0</code> = success, anything else = failure (Foundations Class 15).</li>
  </ul>
  <div class="codebox"><pre>apiVersion: batch/v1
kind: Job
metadata:
  name: unit6-schema
spec:
  backoffLimit: 2                 <span class="c"># two retries after failures, then the Job is failed</span>
  ttlSecondsAfterFinished: 300    <span class="c"># delete Job + pods 300 s after finishing</span>
  template:                       <span class="c"># the pod to create, like in a Deployment</span>
    spec:
      restartPolicy: Never        <span class="c"># a new pod per retry → failed pods' logs stay</span>
      containers:
      - name: schema
        image: postgres:16        <span class="c"># supplies psql</span></pre></div>
  <ul>
    <li>🔑 <strong>A pod's logs are deleted with the pod.</strong> Read them before cleanup. (Live it was said logs remain; the notes correct that.)</li>
    <li><strong>The class Job:</strong> take "create the tables" <strong>out of <code>app.py</code></strong> and run <code>schema.sql</code> from a ConfigMap with <code>psql</code>. The app gets simpler. <code>CREATE TABLE IF NOT EXISTS</code> keeps an existing table and its data, so a rerun is safe.</li>
  </ul>
  <div class="codebox"><pre>kubectl -n "$NAMESPACE" get svc unit6-db
kubectl -n "$NAMESPACE" create configmap unit6-schema \
  --from-file=schema.sql --dry-run=client -o yaml | kubectl -n "$NAMESPACE" apply -f -
kubectl -n "$NAMESPACE" apply -f schema-job.yaml
kubectl -n "$NAMESPACE" wait --for=condition=complete job/unit6-schema --timeout=180s
kubectl -n "$NAMESPACE" logs job/unit6-schema</pre></div>
  <ul>
    <li><code>--dry-run=client -o yaml | apply -f -</code> prints the ConfigMap YAML and pipes it into <code>apply</code>: create-or-update in one line. A ConfigMap, not a Secret, because SQL isn't sensitive (Session 09).</li>
    <li>🔑 <strong>Kubernetes does not make the Deployment wait for the Job.</strong> You check <code>Complete</code>, then deploy the app.</li>
    <li><strong>Failure types:</strong> the container started (its logs explain the error) or couldn't start (pod events: image pull, missing config, no node). A corrected run uses a fresh Job (delete and re-apply).</li>
  </ul>
</section>

<section id="after">
  <div class="label"><span class="tag">09</span><h2>After class: the Job demo, fixed (Bakhtiyar)</h2></div>
  <ul>
    <li>The main-class Job failed: <code>k get jobs</code> showed <code>0/1</code>, <code>describe job</code> said <code>BackoffLimitExceeded</code>, and AI found the cause: the <strong>Service <code>unit6-db</code> didn't exist</strong>. The image also needed rebuilding, so Eldiiar left it as homework.</li>

export REVISED_IMAGE=&lt;account&gt;.dkr.ecr.&lt;region&gt;.amazonaws.com/&lt;repo&gt;:&lt;tag&gt;
<span class="c"># ECR login: the command your ECR repository shows (aws ecr get-login-password | docker login ...)</span>

  <ul>

    <li>Fix: applied the <code>unit6-db</code> Service, <strong>deleted and re-applied the Job</strong> → <code>Complete</code>, logs: <code>relation "trades" already exists, skipping</code>.</li>

  </ul>
</section>

<section id="cron">
  <div class="label"><span class="tag">10</span><h2>CronJobs: a Job on a schedule</h2></div>
  <div class="codebox"><pre>apiVersion: batch/v1
kind: CronJob
spec:
  schedule: "0 2 * * *"     <span class="c"># every day at 02:00</span>
  timeZone: "Etc/UTC"
  jobTemplate:
    spec:                   <span class="c"># the Job spec (pod template, retries) goes here</span></pre></div>
  <div class="flow">schedule hits → CronJob creates a Job → Job creates a pod → task runs → pod exits
→ Job reports success/failure → CronJob sleeps until the next time</div>
  <ul>
    <li>The five fields: <strong>minute, hour, day of month, month, day of week</strong>. <code>*</code> = every value. Same syntax as crontab for the Telegram bot (Class 13).</li>
    <li>Don't write expressions by hand: ask AI or <strong>crontab.guru</strong>.</li>
    <li>💡 Eldiiar's work example: a daily CronJob checks how many days a <strong>GitHub personal access token</strong> has left and warns at two weeks, before an expired token blocks the pipelines.</li>
    <li>A scheduled task may run again after a failure, so it must be safe to repeat (no duplicate records).</li>
    <li>Other uses: daily reports, hourly imports, converting a batch of images. Persistent storage fits uploaded files or a build server's history.</li>
  </ul>
</section>

<section id="quiz">
  <div class="label"><span class="tag">Self-test</span><h2>Quiz: Session 13</h2></div>
  <p><em>Answer each question out loud first, then open the toggle to check. Score yourself out of 10.</em></p>
  <div class="q"><p class="ask">Q1. Your web app pod saves user-uploaded photos to <code>/app/uploads</code>. After a rolling update, every photo is gone, but every trade is still in the database. Why the difference?</p>
    <details><summary>Show answer</summary><div><p><strong>The photos were in the container's own files; the trades were in a separate database.</strong> Files written without a volume sit on the node's disk and disappear when the pod is replaced: a rollout replaces every pod. The trades lived in Postgres, outside the app pod. Fix: mount a claim at <code>/app/uploads</code>, or better, put uploads in S3.</p></div></details></div>
  <div class="q"><p class="ask">Q2. An interviewer asks: "Explain PV, PVC and StorageClass in one breath." What do you say?</p>
    <details><summary>Show answer</summary><div><p><strong>The PVC is the request, the StorageClass is the recipe, and the PV is the record of the disk that got made.</strong> A developer writes a claim (size, access mode, class). The StorageClass's provisioner creates the real disk (EBS gp3), Kubernetes records it as a PV, and binds claim to PV one-to-one. The pod mounts the claim. The developer never touches AWS.</p></div></details></div>
  <div class="q"><p class="ask">Q3. You apply a PVC and it shows <code>Pending</code>. Ten minutes later, after you deploy the pod that uses it, it's still <code>Pending</code>. What's different about these two moments, and what do you run?</p>
    <details><summary>Show answer</summary><div><p><strong>The first Pending is normal; the second is a real problem.</strong> With <code>WaitForFirstConsumer</code>, no disk is created until a pod uses the claim, so the disk lands in the pod's AZ. Once the pod exists, the claim should become <code>Bound</code>. Run <code>kubectl describe pvc &lt;name&gt;</code> and read the Events, e.g. a StorageClass name that doesn't exist, or a provisioning error.</p></div></details></div>
  <div class="q"><p class="ask">Q4. You write a PersistentVolume YAML by hand, apply it, and it shows <code>Available</code>. Is there now an EBS disk in AWS?</p>
    <details><summary>Show answer</summary><div><p><strong>No.</strong> A hand-written PV only records storage that already exists; it creates nothing. That's manual provisioning: someone must first create the disk and point the PV at it. Eldiiar hit exactly this live, his PV pointed at a local path. Only <strong>dynamic provisioning</strong> (claim + StorageClass) makes the disk for you.</p></div></details></div>
  <div class="q"><p class="ask">Q5. Two teams want the same files mounted read-write by pods running on different nodes. Can they use the class EBS StorageClass? What would you suggest?</p>
    <details><summary>Show answer</summary><div><p><strong>No. EBS is ReadWriteOnce: it attaches to one node at a time.</strong> Many nodes writing to the same disk would corrupt it. They need <strong>ReadWriteMany</strong>, which needs shared file storage like <strong>Amazon EFS</strong>. Classic interview trade-off: EBS = block storage for one node, EFS = shared file system for many.</p></div></details></div>
  <div class="q"><p class="ask">Q6. A developer deletes a PVC in the dev namespace to "clean up", then panics: they needed that data. The StorageClass has <code>reclaimPolicy: Delete</code>. What happened, and what would have saved them?</p>
    <details><summary>Show answer</summary><div><p><strong>The EBS disk and its data were deleted with the claim.</strong> Persistent storage survives pod replacement, not claim deletion. <code>Retain</code> would have kept the disk (with ongoing charges) for an admin to recover, which is why production usually uses Retain. And the real safety net is backups: <strong>persistent storage is not a backup</strong>.</p></div></details></div>
  <div class="q"><p class="ask">Q7. You scale a Postgres Deployment with one ReadWriteOnce claim from 1 to 3 replicas. What goes wrong, and why does a StatefulSet fix it?</p>
    <details><summary>Show answer</summary><div><p><strong>Replicas scheduled on other nodes can't attach the disk, and database replicas each need their own data anyway.</strong> A StatefulSet gives each pod a stable name (<code>postgres-0</code>, <code>-1</code>, <code>-2</code>) and its own claim via <code>volumeClaimTemplates</code>. A replaced <code>postgres-1</code> comes back with the same name and the same claim. It still doesn't set up replication; you'd configure that, or use RDS.</p></div></details></div>
  <div class="q"><p class="ask">Q8. "If StatefulSets solve storage, why do most companies run production Postgres on RDS instead of in Kubernetes?" Give two reasons.</p>
    <details><summary>Show answer</summary><div><p><strong>A disk doesn't operate a database, and a shared cluster isn't isolated.</strong> (1) Backups, replication, failover, upgrades and multi-AZ are all still your job with a pod; RDS handles many of them. (2) In a shared cluster, another team's missing limits or a runaway workload can starve your database. You can't control 100 engineers.</p></div></details></div>
  <div class="q"><p class="ask">Q9. Your schema Job shows <code>COMPLETIONS 0/1</code>. <code>describe job</code> says <code>BackoffLimitExceeded</code>, and the logs say <code>could not translate host name "unit6-db"</code>. Walk through the fix, and explain why the app returned 500 in the meantime.</p>
    <details><summary>Show answer</summary><div><p><strong>The Job can't find the database Service, so the tables were never created, so the app fails on every query.</strong> Fix: create the <code>unit6-db</code> Service (re-apply <code>postgres-persistent.yaml</code>), <strong>delete the Job and apply it again</strong> (a failed Job won't retry by itself after backoff), wait for <code>Complete</code>, then check the app. Kubernetes never makes a Deployment wait for a Job, so ordering is on you.</p></div></details></div>
  <div class="q"><p class="ask">Q10. A CronJob runs <code>0 2 * * *</code> and imports yesterday's orders. One night it fails halfway and the retry runs. What could go wrong, and what property should the task have? Bonus: what do <code>backoffLimit</code>, <code>restartPolicy: Never</code> and <code>ttlSecondsAfterFinished</code> each control?</p>
    <details><summary>Show answer</summary><div><p><strong>The retry could insert half the orders twice. The task must be safe to repeat (idempotent)</strong>, like <code>CREATE TABLE IF NOT EXISTS</code> (Scale interview prep: idempotency). Bonus: <code>backoffLimit</code> = how many retries before the Job is failed; <code>restartPolicy: Never</code> = each retry is a new pod, so failed pods' logs stay; <code>ttlSecondsAfterFinished</code> = how long until the Job and its pods (and their logs) are deleted.</p></div></details></div>
  <p><strong>Scoring:</strong> 9–10: your data outlives the pod 🏆 · 7–8: solid 💪 · below 7: reopen the sections above and retry 🔁</p>
</section>
